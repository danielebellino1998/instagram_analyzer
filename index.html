<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Analyzer PRO</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
 --bg:#050816;
 --card:#0c1230;
 --card2:#101942;
 --blue:#3b82f6;
 --purple:#a855f7;
 --pink:#ec4899;
 --text:#f8fafc;
 --muted:#94a3b8;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
 radial-gradient(circle at top left,#312e81 0%,transparent 35%),
 radial-gradient(circle at bottom right,#581c87 0%,transparent 35%),
 var(--bg);
 color:var(--text);
 padding:20px;
}
.card{
 max-width:850px;
 margin:auto;
 background:rgba(12,18,48,.78);
 backdrop-filter:blur(18px);
 border:1px solid rgba(168,85,247,.25);
 border-radius:28px;
 padding:28px;
 box-shadow:0 20px 60px #0008;
}
.header{
 display:flex;
 align-items:center;
 gap:18px;
 margin-bottom:25px;
}
.logo{
 width:65px;height:65px;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));
}
h1{
 margin:0;
 font-size:34px;
}
.subtitle{color:var(--muted)}
.upload{
 background:linear-gradient(135deg,#111936,#17104a);
 border:1px solid #334155;
 border-radius:20px;
 padding:20px;
}
button{
 border:0;
 border-radius:16px;
 padding:15px;
 width:100%;
 margin-top:14px;
 color:white;
 font-weight:700;
 font-size:16px;
 cursor:pointer;
 background:linear-gradient(90deg,var(--blue),var(--purple));
}
.tab{
 background:#151d45;
 border:1px solid #334155;
}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin:20px 0;
}
.stat{
 background:linear-gradient(180deg,#121a42,#0b1029);
 border-radius:20px;
 padding:18px;
 border:1px solid #24305f;
}
.number{font-size:30px;font-weight:800}
.label{color:var(--muted)}
input{
 width:100%;
 padding:15px;
 border-radius:15px;
 border:1px solid #334155;
 background:#070b20;
 color:white;
 margin-top:15px;
}
.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:15px;
 margin-top:10px;
 background:#101735;
 border-radius:15px;
 border:1px solid #24305f;
}
a{
 color:#c084fc;
 text-decoration:none;
 font-weight:700;
}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
h1{font-size:26px}
}
</style>
</head>
<body>
<div class="card">
<div class="header">
<div class="logo">◎</div>
<div>
<h1>Instagram Analyzer v2.0</h1>
<div class="subtitle">Analizza la tua rete Instagram ✨</div>
</div>
</div>

<div class="upload">
<input id="file" type="file" accept=".zip">
<button onclick="analizza()">🚀 Analizza ZIP</button>
</div>

<div id="stats" class="stats"></div>

<button class="tab" onclick="mostra('non')">❌ Account che segui ma che non ti seguono</button>
<button class="tab" onclick="mostra('fan')">👥 Account che ti seguono ma che non segui</button>
<button class="tab" onclick="mostra('pending')">⏳ Richieste di follow in sospeso</button>
<button class="tab" onclick="pulisciTutto()">🗑️ Pulisci tutto</button>

<input id="search" placeholder="🔍 Cerca utente..." oninput="render()">

<h2 id="title"></h2>
<div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
