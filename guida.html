<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guida esportazione dati Instagram</title>
<style>
body{margin:0;background:#bfdbfe;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}
.card{max-width:850px;margin:auto;background:#0c1230;border-radius:28px;padding:30px;box-shadow:0 20px 60px #0008}
h1{font-size:34px;background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;color:transparent}
.step{
    background:#0c1230;
    border-radius:24px;
    padding:30px;
    margin:30px 0;
    border:none;
}

.step h2{
    color:#0f172a;
    margin-top:0;
    font-size:24px;
}

.step img{
    display:block;
    width:55%;
    max-width:600px;
    min-width:320px;
    height:auto;
    margin:30px auto;
    border-radius:24px;
    border:3px solid #bfdbfe;
    box-shadow:
        0 0 25px rgba(255,255,255,0.35),
        0 12px 30px rgba(255,255,255,0.18);
}

@media(max-width:700px){

    .step{
        padding:20px;
    }

    .step img{
        width:95%;
        min-width:auto;
    }

}

.index-link{
    color:#6c71f4;
    text-decoration:none;
    font-weight:700;
}

.index-link:hover{
    color:#1120ff;
}

.index-link:visited{
    color:#bd75cf;
}

.index-link:active{
    color:#6b6ab9;
}
</style>
</head>
<body>
<div class="card">
<h1>Come scaricare il file dati da Instagram</h1>
<p>Segui questi passaggi per ottenere il file ZIP necessario all'analisi.</p>

<div class="step"><img src="Foto1.png"></div>
<div class="step"><img src="Foto2.png"></div>
<div class="step"><img src="Foto3.png"></div>
<div class="step"><img src="Foto4.png"></div>
<div class="step"><img src="Foto5.png"></div>
<div class="step"><img src="Foto6.png"></div>

<p>Una volta scaricato il file ZIP, torna alla pagina dell'Analyzer e caricalo.</p>
<a class="index-link" href="index.html">
➡️ Torna alla pagina iniziale
</a>
</div>
</body>
</html>
